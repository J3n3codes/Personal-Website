<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Website</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>


    <!-- =========================
         LANGUAGE BANNER
         ========================= -->

    <section class="language-banner">

        <!-- Rotating language instruction -->
        <div id="language-message" class="language-message">
            Please select your language
        </div>


        <!-- Language buttons -->
        <div class="language-options">

            <button type="button" onclick="selectLanguage('en')">
                English
            </button>

            <button type="button" onclick="selectLanguage('es')">
                Español
            </button>

            <button type="button" onclick="selectLanguage('fr')">
                Français
            </button>

        </div>

    </section>


    <!-- =========================
         LANGUAGE NOTICE
         ========================= -->

    <div id="learning-notice" class="learning-notice">

    </div>


    <!-- =========================
         NAVIGATION
         ========================= -->

    <header class="site-header">

        <nav class="navbar">

            <a href="#home">Home</a>

            <a href="#about">About</a>

            <a href="#contact">Contact</a>

        </nav>

    </header>


    <!-- =========================
         MAIN CONTENT
         ========================= -->

    <main>


        <!-- Home -->
        <section id="home" class="hero">

            <div class="hero-image-container">

                <img
                    src="tranquility.jpg"
                    alt="Welcome to My Website"
                    class="hero-image"
                >

            </div>


            <div class="hero-text">

                <h1>Welcome to My Website</h1>

                <p>
                    Welcome to my website.
                </p>

            </div>

        </section>


        <!-- About -->
        <section id="about" class="content-section">

            <h2>About</h2>

            <p>
                About me, my work and my hobbies
            </p>

        </section>


        <!-- Contact -->
        <section id="contact" class="content-section">

            <h2>Contact</h2>

            <p>
                Contact me through
            </p>

        </section>

    </main>


    <!-- =========================
         FOOTER
         ========================= -->

    <footer class="footer">

        <p>&copy; 2026 My Website</p>

    </footer>


    <!-- JavaScript -->
    <script src="script.js"></script>

</body>

</html>
